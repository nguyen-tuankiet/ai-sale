<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sales Command Center</title>
<style>
:root { --bg: #f4f6fb; --surface: #fff; --ink: #0f172a; --muted: #52607a; --line: #e3e8f2; --brand: #2563eb; --brand-ink: #fff; --bad: #dc2626; --ok: #16a34a; --warn: #d97706; --soft: #e8efff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --surface: #121a2e; --ink: #eef2fb; --muted: #9aa8c4; --line: #1f2a44; --brand: #4f8cff; --brand-ink: #071024; --soft: #16264a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", Inter, system-ui, sans-serif; }
[hidden] { display: none !important; }
.wrap { width: min(1120px, 100% - 32px); margin: 0 auto; padding: 22px 0 70px; }
h1 { font-size: 1.45rem; margin: 0; } h2 { font-size: 1.05rem; margin: 0 0 12px; } h3 { font-size: .98rem; margin: 0; }
.muted { color: var(--muted); } .bad { color: var(--bad); } .tiny { font-size: .82rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; border-radius: 0; }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; }
.kpi b { font-size: 1.7rem; } .kpi span { color: var(--muted); font-size: .85rem; }
button, input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; }
button { cursor: pointer; font-weight: 600; } button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); } button.danger { color: var(--bad); }
textarea { width: 100%; min-height: 80px; } input.wide, select.wide { width: 100%; }
label.f { display: block; font-weight: 600; margin: 10px 0 4px; }
table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--line); }
.tag.ok { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); color: var(--ok); } .tag.warn { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn); } .tag.bad { background: color-mix(in srgb, var(--bad) 18%, var(--surface)); color: var(--bad); }
.alert { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border: 1px solid var(--bad); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-weight: 600; }
.scroll { overflow-x: auto; } .actions { display: flex; gap: 6px; flex-wrap: wrap; } pre { white-space: pre-wrap; margin: 0; font: inherit; }
.login { max-width: 360px; margin: 14vh auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; } @media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="login" class="wrap login card" hidden>
  <h1>Sales Command Center</h1><p class="muted">Đăng nhập quản trị.</p>
  <form id="login-form"><input class="wide" id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required autofocus><p></p><button class="primary wide" type="submit">Đăng nhập</button></form>
  <p class="bad" id="login-error"></p>
</div>

<div id="app" class="wrap" hidden>
  <div class="top"><div><h1>Sales Command Center</h1><div class="muted tiny" id="sub">Agent chỉ tạo bản nháp. Bạn duyệt trước khi bất cứ thứ gì được đăng.</div></div>
    <div class="row"><span id="msg" class="muted"></span><a id="landing-admin" class="tiny" target="_blank" rel="noreferrer">Doanh thu & lượt xem (trang bán) ↗</a><button id="logout" type="button">Đăng xuất</button></div></div>
  <div id="kill-alert" class="alert" hidden>CÔNG TẮC DỪNG KHẨN CẤP ĐANG BẬT: không tạo việc mới, không đăng bài.</div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CH = { youtube: 'YouTube', facebook: 'Facebook', tiktok: 'TikTok', website: 'Website/SEO' };
  var ST = { DRAFT: 'Nháp', PENDING_APPROVAL: 'Chờ duyệt', APPROVED: 'Đã duyệt', SCHEDULED: 'Đã xếp lịch', PUBLISHING: 'Đang đăng', PUBLISHED: 'Đã đăng', FAILED: 'Lỗi', REJECTED: 'Từ chối', CANCELLED: 'Đã hủy' };
  var TABS = [['overview', 'Tổng quan'], ['analytics', 'Phân tích'], ['products', 'Sản phẩm'], ['campaigns', 'Chiến dịch'], ['content', 'Duyệt nội dung'], ['research', 'Nghiên cứu'], ['conversion', 'Chuyển đổi'], ['support', 'Hỗ trợ khách'], ['settings', 'Cài đặt']];
  var tab = 'overview';
  var money = function (n) { return Number(n).toLocaleString('vi-VN') + 'đ'; };
  function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
  function btn(text, fn, cls) { var b = el('button', text, cls); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function say(text, bad) { var m = $('msg'); m.textContent = text; m.className = bad ? 'bad' : 'muted'; }
  function tag(text, kind) { return el('span', text, 'tag' + (kind ? ' ' + kind : '')); }
  function field(label, node) { var w = document.createElement('div'); w.append(el('label', label, 'f'), node); return w; }
  function input(value, type) { var i = document.createElement('input'); i.className = 'wide'; i.type = type || 'text'; i.value = value == null ? '' : value; return i; }
  function area(value, rows) { var a = document.createElement('textarea'); a.rows = rows || 3; a.value = value || ''; return a; }

  function rpc(method, path, body) {
    return fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ method: method, path: path, input: body || {} }) }).then(function (r) {
      if (r.status === 401) { showLogin(); return Promise.reject(new Error('Chưa đăng nhập')); }
      return r.json().then(function (j) { if (!r.ok) { var e = new Error((j.error && j.error.message) || 'Lỗi ' + r.status); throw e; } return j.data; });
    });
  }
  function act(promise, ok) { return promise.then(function (d) { if (ok) say(ok); return render().then(function () { return d; }); }).catch(function (e) { say(e.message, true); }); }

  function showLogin() { $('app').hidden = true; $('login').hidden = false; }
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    fetch('/api/admin-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('password').value }) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'Không đăng nhập được'); start(); }); }).catch(function (err) { $('login-error').textContent = err.message; });
  });
  $('logout').addEventListener('click', function () { fetch('/api/admin-login', { method: 'DELETE' }).then(showLogin); });

  function tabsBar() {
    var bar = $('tabs'); bar.replaceChildren();
    TABS.forEach(function (t) { var b = btn(t[1], function () { tab = t[0]; render(); }); if (tab === t[0]) b.className = 'on'; bar.append(b); });
  }

  // ---------------------------------------------------------------- Tổng quan
  function viewOverview(o) {
    var v = el('div');
    var kpis = [['Sản phẩm đang bán', o.products.filter(function (p) { return p.status === 'selling'; }).length], ['Chiến dịch đang chạy', o.campaigns.active], ['Chiến dịch chờ duyệt', o.campaigns.pending], ['Nội dung chờ duyệt', o.content.PENDING_APPROVAL], ['Đến giờ đăng tay', o.dueForManualPost], ['Việc của agent chờ / lỗi', o.jobs.QUEUED + o.jobs.RUNNING + ' / ' + o.jobs.FAILED], ['Ý tưởng mới', o.work.ideasNew], ['Đề xuất chờ bạn', o.work.proposalsPending], ['Phiếu hỗ trợ đang mở', o.work.ticketsOpen + (o.work.ticketsNeedOwner ? ' (' + o.work.ticketsNeedOwner + ' cần bạn)' : '')]];
    var g = el('div', undefined, 'grid'); kpis.forEach(function (k) { var c = el('div', undefined, 'kpi'); c.append(el('b', String(k[1])), el('span', k[0])); g.append(c); }); v.append(g);

    var ctl = el('div', undefined, 'card'); ctl.append(el('h2', 'Điều khiển'));
    var row = el('div', undefined, 'row');
    row.append(btn(o.killSwitch ? 'Bật lại hệ thống' : 'DỪNG KHẨN CẤP', function () { act(rpc('POST', 'kill-switch', { enabled: !o.killSwitch }), o.killSwitch ? 'Đã bật lại.' : 'Đã dừng toàn bộ.'); }, o.killSwitch ? 'primary' : 'danger'),
      btn('Chạy Sales Manager', function () { act(rpc('POST', 'manager/run'), 'Sales Manager đã bổ sung việc cho agent.').then(function (d) { if (d) say('Đã tạo ' + d.created.length + ' việc' + (d.skippedByDailyCap.length ? ' (' + d.skippedByDailyCap.length + ' mục bị giới hạn mỗi ngày)' : '') + '.'); }); }, 'primary'),
      btn('Tạo nháp bằng mẫu cố định', function () { act(rpc('POST', 'plan', {}), 'Đã tạo nháp từ mẫu (không dùng AI).'); }));
    ctl.append(row, el('p', 'Sales Manager chỉ bổ sung việc cho chiến dịch ĐÃ DUYỆT và đang chạy. Mọi bản nháp vẫn phải qua mục "Duyệt nội dung".', 'muted tiny'));
    v.append(ctl);

    var ag = el('div', undefined, 'card'); ag.append(el('h2', 'Các agent'));
    var t = el('table'); o.agents.forEach(function (a) {
      var tr = el('tr'); var kind = { online: 'ok', rule: 'ok', manual: 'warn', offline: 'bad', off: '' }[a.state]; var label = { online: 'Đang chạy', rule: 'Luật cố định', manual: 'Thủ công', offline: 'Chưa kết nối', off: 'Chưa xây' }[a.state];
      var n = el('td'); n.append(el('b', a.name)); tr.append(n, (function () { var x = el('td'); x.append(tag(label, kind)); return x; })(), el('td', a.note, 'muted')); t.append(tr);
    }); ag.append(t); v.append(ag);

    if (o.failedContent.length) { var f = el('div', undefined, 'card'); f.append(el('h2', 'Bài đăng lỗi')); o.failedContent.forEach(function (c) { f.append(el('div', CH[c.channel] + ': ' + (c.error || 'Lỗi'), 'bad')); }); v.append(f); }
    return v;
  }

  // ---------------------------------------------------------------- Sản phẩm (Product Registry)
  function viewProducts(list) {
    var v = el('div');
    var card = el('div', undefined, 'card'); card.append(el('h2', 'Product Registry'));
    card.append(el('p', 'Mỗi sản phẩm là một bản ghi dữ liệu. Agent chỉ đọc từ đây, nên thêm sản phẩm mới không cần sửa mã. Giá ở đây phải khớp giá trên trang bán (hệ thống không tự đồng bộ).', 'muted tiny'));
    var t = el('table'); var h = el('tr'); ['Sản phẩm', 'Giá', 'Trạng thái', ''].forEach(function (x) { h.append(el('th', x)); }); t.append(h);
    list.forEach(function (p) {
      var tr = el('tr'); var n = el('td'); n.append(el('b', p.name), el('div', (p.type === 'tool' ? 'Công cụ' : 'Tài liệu số') + ' · ' + (p.buyUrl || 'chưa có link mua'), 'muted tiny')); if (p.missing.length) n.append(el('div', 'Thiếu: ' + p.missing.join(', '), 'bad tiny'));
      var st = el('td'); st.append(tag({ selling: 'Đang bán', draft: 'Nháp', paused: 'Tạm dừng' }[p.status], p.status === 'selling' ? 'ok' : ''));
      var a = el('td'); var box = el('div', undefined, 'actions');
      box.append(btn('Sửa', function () { form(p); }));
      if (p.status !== 'selling') box.append(btn('Mở bán', function () { act(rpc('POST', 'products/' + p.id + '/status', { status: 'selling' }), 'Đã mở bán.'); }, 'primary')); else box.append(btn('Tạm dừng', function () { act(rpc('POST', 'products/' + p.id + '/status', { status: 'paused' }), 'Đã tạm dừng (chiến dịch của sản phẩm này cũng tạm dừng).'); }));
      a.append(box); tr.append(n, el('td', money(p.priceVnd)), st, a); t.append(tr);
    });
    card.append(t); card.append(el('p')); card.append(btn('Thêm sản phẩm mới', function () { form(null); }, 'primary')); v.append(card);
    var holder = el('div'); holder.id = 'pform'; v.append(holder);
    function form(p) {
      var f = el('div', undefined, 'card'); f.append(el('h2', p ? 'Sửa: ' + p.name : 'Sản phẩm mới'));
      var name = input(p && p.name); var type = document.createElement('select'); type.className = 'wide'; [['tool', 'Công cụ (quyền sử dụng)'], ['digital', 'Tài liệu số (giao file)']].forEach(function (o) { var op = el('option', o[1]); op.value = o[0]; type.append(op); }); type.value = (p && p.type) || 'tool';
      var price = input(p && p.priceVnd, 'number'); var url = input(p && p.buyUrl); var aud = input(p && p.audience);
      var ben = area(p && p.benefits.join('\n'), 3); var feat = area(p && p.approvedFeatures.join('\n'), 4); var del = input(p && p.deliveryNote); var sup = input(p && p.supportPolicy);
      var faq = area(p && (p.faq || []).map(function (x) { return x.q + ' | ' + x.a; }).join('\n'), 5); var kw = input(p && (p.keywords || []).join(', ')); var comp = input(p && p.competitors); var inc = input(p && (p.includes || []).join(', '));
      var two = el('div', undefined, 'two'); two.append(field('Tên', name), field('Loại', type), field('Giá (đồng)', price), field('Link mua (trang bán, có thể kèm #mua)', url));
      f.append(two, field('Khách mục tiêu', aud), field('Lợi ích cho khách (mỗi dòng một ý)', ben), field('Tính năng ĐÃ XÁC NHẬN (agent chỉ được nói những điều này)', feat), field('Cách giao hàng (ghi chú)', del), field('Chính sách hỗ trợ', sup),
        field('FAQ đã duyệt cho Customer Agent (mỗi dòng: Câu hỏi | Câu trả lời). Chỉ ghi điều đúng sự thật.', faq), field('Từ khóa (cách nhau dấu phẩy, bạn tự cung cấp)', kw), field('Ghi chú về đối thủ (bạn tự cung cấp, không bắt buộc)', comp), field('Sản phẩm này đã bao gồm (mã sản phẩm, cách nhau dấu phẩy; để Conversion Agent không đề xuất combo vô nghĩa)', inc));
      f.append(el('p'), btn('Lưu', function () { act(rpc(p ? 'PATCH' : 'POST', p ? 'products/' + p.id : 'products', { name: name.value, type: type.value, priceVnd: price.value, buyUrl: url.value, audience: aud.value, benefits: ben.value, approvedFeatures: feat.value, deliveryNote: del.value, supportPolicy: sup.value, faq: faq.value, keywords: kw.value, competitors: comp.value, includes: inc.value }), 'Đã lưu. Chiến dịch đang chạy của sản phẩm này (nếu đổi giá/tính năng) cần duyệt lại.'); }, 'primary'));
      holder.replaceChildren(f); f.scrollIntoView({ behavior: 'smooth' });
    }
    return v;
  }

  // ---------------------------------------------------------------- Chiến dịch
  function viewCampaigns(data) {
    var v = el('div'); var products = data.products, camps = data.campaigns;
    var nameOf = function (id) { var p = products.filter(function (x) { return x.id === id; })[0]; return p ? p.name : id; };
    var add = el('div', undefined, 'card'); add.append(el('h2', 'Chiến dịch mới'));
    var sel = document.createElement('select'); sel.className = 'wide'; products.filter(function (p) { return p.status === 'selling'; }).forEach(function (p) { var o = el('option', p.name); o.value = p.id; sel.append(o); });
    var chRow = el('div', undefined, 'row'); var boxes = {}; Object.keys(CH).forEach(function (c) { var l = el('label', undefined, 'row'); var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; boxes[c] = cb; l.append(cb, document.createTextNode(CH[c])); chRow.append(l); });
    add.append(field('Sản phẩm (chỉ sản phẩm đang bán)', sel), field('Kênh', chRow), el('p'), btn('Tạo chiến dịch (chờ duyệt)', function () { act(rpc('POST', 'campaigns', { productId: sel.value, channels: Object.keys(boxes).filter(function (c) { return boxes[c].checked; }) }), 'Đã tạo. Đọc hồ sơ rồi bấm Duyệt để chạy.'); }, 'primary'));
    add.append(el('p', 'Hồ sơ chiến dịch (khách mục tiêu, các góc tiếp cận) được suy ra từ Product Registry, không thêm claim nào ngoài dữ liệu đã khai.', 'muted tiny')); v.append(add);
    if (!camps.length) { var none = el('div', undefined, 'card'); none.append(el('p', 'Chưa có chiến dịch nào.', 'muted')); v.append(none); }
    camps.forEach(function (c) {
      var card = el('div', undefined, 'card'); var head = el('div', undefined, 'row'); head.append(el('h3', c.name + ' · ' + nameOf(c.productId)), tag({ ACTIVE: 'Đang chạy', PENDING_APPROVAL: 'Chờ duyệt', PAUSED: 'Tạm dừng' }[c.status], c.status === 'ACTIVE' ? 'ok' : c.status === 'PENDING_APPROVAL' ? 'warn' : '')); card.append(head);
      card.append(el('div', 'Khách mục tiêu: ' + (c.audience || '—'), 'muted'), el('div', 'Kênh: ' + c.channels.map(function (x) { return CH[x]; }).join(', '), 'muted'));
      var ul = el('ul'); c.messages.forEach(function (m) { ul.append(el('li', m.angle)); }); card.append(el('div', 'Góc tiếp cận:', 'muted tiny'), ul);
      var box = el('div', undefined, 'actions');
      if (c.status === 'PENDING_APPROVAL') box.append(btn('Duyệt và chạy', function () { act(rpc('POST', 'campaigns/' + c.id + '/approve'), 'Đã duyệt. Bấm "Chạy Sales Manager" ở Tổng quan để agent bắt đầu viết.'); }, 'primary'));
      if (c.status === 'ACTIVE') box.append(btn('Tạm dừng', function () { act(rpc('POST', 'campaigns/' + c.id + '/pause'), 'Đã tạm dừng.'); }));
      if (c.status === 'PAUSED') box.append(btn('Tiếp tục', function () { act(rpc('POST', 'campaigns/' + c.id + '/resume'), 'Đã tiếp tục.'); }));
      box.append(btn('Sửa khách mục tiêu', function () { var a = prompt('Khách mục tiêu:', c.audience); if (a !== null) act(rpc('PATCH', 'campaigns/' + c.id, { audience: a }), 'Đã lưu. Chiến dịch cần duyệt lại.'); }));
      card.append(box); v.append(card);
    });
    return v;
  }

  // ---------------------------------------------------------------- Duyệt nội dung
  function viewContent(rows) {
    var v = el('div'); var card = el('div', undefined, 'card'); card.append(el('h2', 'Nội dung chờ bạn xử lý'));
    var order = { PENDING_APPROVAL: 0, DRAFT: 1, APPROVED: 2, SCHEDULED: 3, FAILED: 4 };
    rows = rows.filter(function (c) { return ['CANCELLED', 'PUBLISHED'].indexOf(c.status) < 0; }).sort(function (a, b) { return (order[a.status] == null ? 9 : order[a.status]) - (order[b.status] == null ? 9 : order[b.status]); });
    var t = el('table'); var h = el('tr'); ['Kênh', 'Nội dung', 'Trạng thái', ''].forEach(function (x) { h.append(el('th', x)); }); t.append(h);
    if (!rows.length) { var tr = el('tr'); var td = el('td', 'Không có nội dung nào chờ xử lý.', 'muted'); td.colSpan = 4; tr.append(td); t.append(tr); }
    rows.forEach(function (c) {
      var tr = el('tr'); tr.append(el('td', CH[c.channel] || c.channel));
      var body = el('td'); body.append(el('b', c.title), el('pre', c.body.slice(0, 500) + (c.body.length > 500 ? '…' : '')), el('div', 'Link: ' + c.targetUrl, 'muted tiny'));
      if (c.source && c.source.indexOf('agent') === 0) body.append(el('div', 'Do Content Agent soạn · cần bạn đọc kỹ từng câu', 'muted tiny'));
      if (c.gate && c.gate.errors.length) c.gate.errors.forEach(function (e) { body.append(el('div', '✗ ' + e, 'bad tiny')); }); if (c.lastError) body.append(el('div', c.lastError, 'bad tiny')); tr.append(body);
      var st = el('td'); st.append(tag(ST[c.status] || c.status, c.status === 'PENDING_APPROVAL' ? 'warn' : '')); if (c.manualDue && c.status === 'SCHEDULED') st.append(document.createTextNode(' '), tag('Đến giờ đăng tay', 'warn')); tr.append(st);
      var a = el('td'); var box = el('div', undefined, 'actions'); var post = function (action, body2, ok) { return function () { act(rpc('POST', 'content/' + c.id + '/' + action, body2), ok); }; };
      if (['DRAFT', 'REJECTED'].indexOf(c.status) >= 0) box.append(btn('Gửi duyệt', post('submit', {}, 'Đã gửi duyệt.')));
      if (c.status === 'PENDING_APPROVAL') box.append(btn('Duyệt', post('approve', {}, 'Đã duyệt.'), 'primary'), btn('Từ chối', post('reject', {}, 'Đã từ chối.')));
      if (['APPROVED', 'FAILED'].indexOf(c.status) >= 0) box.append(btn('Xếp lịch (1 giờ nữa)', post('schedule', { scheduledAt: new Date(Date.now() + 3600e3).toISOString() }, 'Đã xếp lịch.')));
      if (['APPROVED', 'SCHEDULED'].indexOf(c.status) >= 0) {
        box.append(btn('Lấy gói đăng', function () { rpc('POST', 'content/' + c.id + '/publish', {}).then(function (d) { pack(d.pack); render(); }).catch(function (e) { say(e.message, true); }); }));
        box.append(btn('Đã đăng', function () { var u = prompt('Dán URL bài đã đăng:'); if (u) act(rpc('POST', 'content/' + c.id + '/mark-published', { url: u }), 'Đã ghi nhận.'); }));
      }
      box.append(btn('Sửa', function () { var title = prompt('Tiêu đề:', c.title); if (title === null) return; var b2 = prompt('Nội dung:', c.body); if (b2 === null) return; act(rpc('PATCH', 'content/' + c.id, { title: title, body: b2 }), 'Đã lưu. Nội dung đổi nên cần duyệt lại.'); }), btn('Hủy', post('cancel', {}, 'Đã hủy.'), 'danger'));
      a.append(box); tr.append(a); t.append(tr);
    });
    var sc = el('div', undefined, 'scroll'); sc.append(t); card.append(sc); v.append(card); return v;
  }
  function pack(p) {
    var text = 'KÊNH: ' + p.channel + '\n\nTIÊU ĐỀ: ' + p.title + '\n\nNỘI DUNG:\n' + p.body + '\n\nLINK (đã có UTM): ' + p.link + '\n\n' + p.checklist.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { say('Đã chép gói đăng vào clipboard. Dán lên kênh rồi bấm "Đã đăng".'); }, function () { prompt('Chép gói đăng:', text); }); else prompt('Chép gói đăng:', text);
  }

  // ---------------------------------------------------------------- Phân tích
  function viewAnalytics(r) {
    var v = el('div'); var head = el('div', undefined, 'card'); head.append(el('h2', 'Phân tích số liệu trang bán'));
    if (!r.configured) { head.append(el('p', 'Chưa cấu hình. Đặt biến LANDING_ADMIN_PASSWORD (mật khẩu /admin/ của trang bán) trên Vercel để agent đọc số liệu. Chỉ đọc, không sửa gì trên trang bán.', 'muted')); v.append(head); return v; }
    head.append(btn('Cập nhật số liệu (30 ngày)', function () { act(rpc('POST', 'analytics/refresh', { days: 30 }), 'Đã gọi trang bán.').then(function (d) { if (d && d.lastError) say(d.lastError, true); else say('Đã cập nhật.'); }); }, 'primary'));
    if (r.lastError) head.append(el('p', r.lastError, 'bad'));
    if (r.summary) head.append(el('p', 'Lần đọc gần nhất: ' + new Date(r.summary.fetchedAt).toLocaleString('vi-VN') + ' · ' + r.summary.days + ' ngày', 'muted tiny'));
    v.append(head);
    if (!r.summary) return v;
    var t = r.summary.totals, rt = r.summary.rates, pc = function (x) { return x == null ? '—' : (x * 100).toFixed(1) + '%'; };
    var g = el('div', undefined, 'grid'); [['Khách', t.visitors], ['Thấy khung giá', t.pricingViews + ' (' + pc(rt.pricing) + ')'], ['Bấm Mua', t.buyClicks + ' (' + pc(rt.buyClick) + ')'], ['Đơn đã tạo', t.orders], ['Đơn đã trả', t.paid + ' (' + pc(rt.paidAfterOrder) + ' đơn tạo)'], ['Doanh thu', money(t.revenue)]].forEach(function (k) { var c = el('div', undefined, 'kpi'); c.append(el('b', String(k[1])), el('span', k[0])); g.append(c); }); v.append(g);
    var ins = el('div', undefined, 'card'); ins.append(el('h2', 'Gợi ý để bạn xem xét'));
    if (!r.insights.length) ins.append(el('p', 'Chưa có gợi ý.', 'muted')); r.insights.forEach(function (i) { ins.append(el('div', (i.level === 'warn' ? '⚠ ' : '• ') + i.text)); });
    ins.append(el('p', 'Đây là gợi ý theo luật đơn giản, không khẳng định nguyên nhân.', 'muted tiny')); v.append(ins);
    var src = el('div', undefined, 'card'); src.append(el('h2', 'Lượt truy cập theo nguồn giới thiệu (ước lượng)'));
    var tb = el('table'); r.summary.visitsBySource.forEach(function (s) { var tr = el('tr'); tr.append(el('td', s.channel), el('td', String(s.visits))); tb.append(tr); }); src.append(tb, el('p', r.summary.attributionNote, 'muted tiny')); v.append(src);
    return v;
  }

  // ---------------------------------------------------------------- Nghiên cứu
  function productSelect(products) { var s = document.createElement('select'); products.filter(function (p) { return p.status === 'selling'; }).forEach(function (p) { var o = el('option', p.name); o.value = p.id; s.append(o); }); return s; }
  function viewResearch(d) {
    var v = el('div'); var c = el('div', undefined, 'card'); c.append(el('h2', 'Research Agent'));
    c.append(el('p', 'Đề xuất ý tưởng nội dung dưới dạng GIẢ THUYẾT. Hệ thống không có dữ liệu thị trường, nên không có ý tưởng nào được coi là chắc chắn hiệu quả. Cần worker chạy trên máy bạn, tốn quota Muse.', 'muted tiny'));
    var sel = productSelect(d.products); var r = el('div', undefined, 'row'); r.append(sel, btn('Nhờ Research Agent', function () { act(rpc('POST', 'research/run', { productId: sel.value }), 'Đã xếp việc. Khi worker chạy xong, ý tưởng hiện ở đây.'); }, 'primary')); c.append(r); v.append(c);
    var card = el('div', undefined, 'card'); card.append(el('h2', 'Ý tưởng (xếp theo điểm: độ phù hợp trừ công sức)'));
    var t = el('table'); var h = el('tr'); ['Ý tưởng', 'Kênh', 'Công sức', 'Phù hợp', 'Điểm', ''].forEach(function (x) { h.append(el('th', x)); }); t.append(h);
    var ideas = d.ideas.filter(function (i) { return i.status === 'NEW'; });
    if (!ideas.length) { var tr0 = el('tr'); var td0 = el('td', 'Chưa có ý tưởng mới.', 'muted'); td0.colSpan = 6; tr0.append(td0); t.append(tr0); }
    ideas.forEach(function (i) {
      var tr = el('tr'); var n = el('td'); n.append(el('b', i.topic), el('div', i.angle), el('div', 'Vì sao: ' + i.why, 'muted tiny'), tag('Chưa kiểm chứng', 'warn'));
      var a = el('td'); var box = el('div', undefined, 'actions'); var mine = d.campaigns.filter(function (x) { return x.productId === i.productId; });
      box.append(btn('Thêm vào chiến dịch', function () {
        if (!mine.length) { say('Sản phẩm này chưa có chiến dịch. Tạo chiến dịch trước.', true); return; }
        var pick = mine[0]; if (mine.length > 1) { var n2 = prompt('Chọn chiến dịch:\n' + mine.map(function (x, k) { return (k + 1) + '. ' + x.name; }).join('\n'), '1'); if (n2 === null) return; pick = mine[Number(n2) - 1]; if (!pick) return; }
        act(rpc('POST', 'research/' + i.id + '/accept', { campaignId: pick.id }), 'Đã thêm góc tiếp cận. Chiến dịch cần duyệt lại.');
      }, 'primary'), btn('Bỏ', function () { act(rpc('POST', 'research/' + i.id + '/reject'), 'Đã bỏ.'); }));
      a.append(box); tr.append(n, el('td', CH[i.channel] || 'Bất kỳ'), el('td', { low: 'Thấp', medium: 'Vừa', high: 'Cao' }[i.effort]), el('td', i.fit + '/5'), el('td', String(i.score)), a); t.append(tr);
    });
    card.append(t); v.append(card); return v;
  }

  // ---------------------------------------------------------------- Chuyển đổi
  function viewConversion(d) {
    var v = el('div'); var c = el('div', undefined, 'card'); c.append(el('h2', 'Conversion Agent'));
    c.append(el('p', 'Chỉ ĐỀ XUẤT tiêu đề/CTA và combo để bạn cân nhắc. Không tự sửa trang bán, không tự đổi giá hay giảm giá, và chưa có thử nghiệm A/B (trang bán không hỗ trợ).', 'muted tiny'));
    var sel = productSelect(d.products); var r = el('div', undefined, 'row'); r.append(sel, btn('Đề xuất tiêu đề và CTA (AI)', function () { act(rpc('POST', 'proposals/run', { productId: sel.value, kind: 'landing_copy' }), 'Đã xếp việc cho worker.'); }, 'primary'), btn('Đề xuất combo (luật cố định)', function () { act(rpc('POST', 'proposals/run', { kind: 'combo' }), 'Đã kiểm tra các cặp sản phẩm.').then(function (x) { if (x && x.note) say(x.note); }); })); c.append(r); v.append(c);
    var card = el('div', undefined, 'card'); card.append(el('h2', 'Đề xuất chờ bạn'));
    var open = d.proposals.filter(function (p) { return p.status === 'PENDING_APPROVAL'; });
    if (!open.length) card.append(el('p', 'Không có đề xuất nào đang chờ.', 'muted'));
    open.forEach(function (p) {
      var row = el('div', undefined, 'card'); row.append(tag(p.type === 'combo' ? 'Combo' : 'Tiêu đề/CTA'), el('h3', p.title));
      if (p.type === 'combo') row.append(el('div', 'Tổng giá lẻ: ' + money(p.detail.listPriceSum) + '. Giá combo do bạn quyết định, hệ thống không tự đặt.', 'muted'));
      else row.append(el('div', 'CTA: ' + p.detail.cta), el('div', p.detail.rationale, 'muted tiny'));
      var box = el('div', undefined, 'actions');
      box.append(btn(p.type === 'combo' ? 'Chấp nhận (nhập giá)' : 'Chấp nhận (tôi sẽ tự áp dụng)', function () { var body = {}; if (p.type === 'combo') { var price = prompt('Giá combo (đồng):'); if (price === null) return; body.priceVnd = price; } act(rpc('POST', 'proposals/' + p.id + '/accept', body), p.type === 'combo' ? 'Đã tạo sản phẩm combo ở trạng thái nháp.' : 'Đã ghi nhận. Hãy tự cập nhật trang bán.'); }, 'primary'), btn('Từ chối', function () { act(rpc('POST', 'proposals/' + p.id + '/reject'), 'Đã từ chối.'); }));
      row.append(el('p'), box); card.append(row);
    });
    v.append(card); return v;
  }

  // ---------------------------------------------------------------- Hỗ trợ khách
  function viewSupport(d) {
    var v = el('div'); var c = el('div', undefined, 'card'); c.append(el('h2', 'Customer Agent: phiếu hỗ trợ'));
    c.append(el('p', 'Dán câu hỏi của khách (từ Zalo, Facebook, email…). Agent soạn NHÁP trả lời từ FAQ của bạn; bạn đọc, chép và tự trả lời. Hệ thống không gửi gì cho khách. Ca hoàn tiền/mất tiền luôn chuyển cho bạn. Email, số điện thoại và chuỗi giống cookie/token bị che khi lưu.', 'muted tiny'));
    var sel = document.createElement('select'); d.products.forEach(function (p) { var o = el('option', p.name); o.value = p.id; sel.append(o); });
    var ref = input(''); ref.placeholder = 'Khách là ai (ví dụ: fb An) — không bắt buộc'; var q = area('', 3); q.placeholder = 'Nội dung khách hỏi';
    c.append(field('Sản phẩm khách hỏi', sel), field('Khách', ref), field('Câu hỏi', q), el('p'), btn('Tạo phiếu và soạn nháp', function () { act(rpc('POST', 'tickets', { productId: sel.value, customerRef: ref.value, question: q.value }), 'Đã tạo phiếu và soạn nháp.'); }, 'primary')); v.append(c);
    var open = d.tickets.filter(function (t) { return ['RESOLVED', 'CLOSED'].indexOf(t.status) < 0; });
    var card = el('div', undefined, 'card'); card.append(el('h2', 'Đang mở (' + open.length + ')'));
    if (!open.length) card.append(el('p', 'Không có phiếu nào đang mở.', 'muted'));
    open.forEach(function (t) {
      var row = el('div', undefined, 'card'); var head = el('div', undefined, 'row'); head.append(el('b', (t.customerRef || 'Khách') + ' · ' + new Date(t.createdAt).toLocaleString('vi-VN')));
      if (t.needsOwner) head.append(tag('Cần chủ shop xem' + (t.reasons.length ? ': ' + t.reasons.join(', ') : ''), 'bad')); row.append(head, el('pre', t.question, 'muted'));
      if (t.draft) { row.append(el('div', 'Nháp trả lời (' + { faq: 'từ FAQ', ai: 'AI soạn', template: 'mẫu', manual: 'bạn sửa' }[t.draft.source] + '):', 'muted tiny'), el('pre', t.draft.text)); t.draft.issues.forEach(function (i) { row.append(el('div', '✗ ' + i, 'bad tiny')); }); }
      var box = el('div', undefined, 'actions');
      if (t.draft) box.append(btn('Chép nháp', function () { if (navigator.clipboard) navigator.clipboard.writeText(t.draft.text).then(function () { say('Đã chép nháp. Dán vào cuộc trò chuyện với khách.'); }); else prompt('Chép nháp:', t.draft.text); }, 'primary'));
      box.append(btn('Sửa nháp', function () { var x = prompt('Nội dung trả lời:', t.draft ? t.draft.text : ''); if (x !== null) act(rpc('POST', 'tickets/' + t.id + '/edit', { text: x }), 'Đã lưu nháp.'); }), btn('Soạn lại theo FAQ', function () { act(rpc('POST', 'tickets/' + t.id + '/draft'), 'Đã soạn lại.'); }), btn('Nhờ AI soạn', function () { act(rpc('POST', 'tickets/' + t.id + '/ask-ai'), 'Đã xếp việc cho worker.'); }), btn('Đã trả lời xong', function () { act(rpc('POST', 'tickets/' + t.id + '/resolve'), 'Đã đóng phiếu.'); }), btn('Xóa', function () { if (confirm('Xóa phiếu này?')) act(rpc('DELETE', 'tickets/' + t.id), 'Đã xóa.'); }, 'danger'));
      row.append(el('p'), box); card.append(row);
    });
    v.append(card); return v;
  }

  // ---------------------------------------------------------------- Cài đặt
  function viewSettings(o) {
    var v = el('div'); var c1 = el('div', undefined, 'card'); c1.append(el('h2', 'Kênh được phép dùng'));
    var row = el('div', undefined, 'row'); Object.keys(CH).forEach(function (c) { var l = el('label', undefined, 'row'); var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!o.channels[c]; cb.addEventListener('change', function () { var x = {}; x[c] = cb.checked; act(rpc('PATCH', 'settings', { channels: x }), 'Đã lưu.'); }); l.append(cb, document.createTextNode(CH[c])); row.append(l); }); c1.append(row, el('p', 'Kênh tắt thì không lấy được gói đăng. Mặc định tắt cho tới khi bạn bật.', 'muted tiny')); v.append(c1);
    var c2 = el('div', undefined, 'card'); c2.append(el('h2', 'Giới hạn để không tốn quota Muse'));
    var cap = input(o.settings.dailyJobCap, 'number'); var per = input(o.settings.draftsPerChannel, 'number');
    var two = el('div', undefined, 'two'); two.append(field('Số việc tối đa mỗi 24 giờ', cap), field('Số bản nháp luôn có sẵn mỗi kênh', per)); c2.append(two, el('p'), btn('Lưu', function () { act(rpc('PATCH', 'agent-settings', { dailyJobCap: cap.value, draftsPerChannel: per.value }), 'Đã lưu.'); }, 'primary')); v.append(c2);
    var c3 = el('div', undefined, 'card'); c3.append(el('h2', 'Kết nối Content Agent'));
    c3.append(el('p', 'Content Agent chạy trên máy bạn để dùng Chat Muse. Mở cửa sổ lệnh trong thư mục dự án và chạy:'), el('pre', 'set API_BASE=' + location.origin + '\nset WORKER_TOKEN=<giá trị WORKER_TOKEN trên Vercel>\nnode worker/worker.mjs'), el('p', 'Khi worker kết nối, agent "Content Agent" ở Tổng quan chuyển sang "Đang chạy". Cookie Muse ở lại máy bạn.', 'muted tiny')); v.append(c3);
    return v;
  }

  function render() {
    tabsBar();
    var load;
    if (tab === 'overview') load = rpc('GET', 'overview').then(function (o) { $('kill-alert').hidden = !o.killSwitch; $('landing-admin').href = o.landingUrl + '/admin/'; return viewOverview(o); });
    else if (tab === 'products') load = rpc('GET', 'products').then(viewProducts);
    else if (tab === 'campaigns') load = Promise.all([rpc('GET', 'products'), rpc('GET', 'campaigns')]).then(function (r) { return viewCampaigns({ products: r[0], campaigns: r[1] }); });
    else if (tab === 'content') load = rpc('GET', 'content').then(viewContent);
    else if (tab === 'analytics') load = rpc('GET', 'analytics').then(viewAnalytics);
    else if (tab === 'research') load = Promise.all([rpc('GET', 'products'), rpc('GET', 'research'), rpc('GET', 'campaigns')]).then(function (r) { return viewResearch({ products: r[0], ideas: r[1], campaigns: r[2] }); });
    else if (tab === 'conversion') load = Promise.all([rpc('GET', 'products'), rpc('GET', 'proposals')]).then(function (r) { return viewConversion({ products: r[0], proposals: r[1] }); });
    else if (tab === 'support') load = Promise.all([rpc('GET', 'products'), rpc('GET', 'tickets')]).then(function (r) { return viewSupport({ products: r[0], tickets: r[1] }); });
    else load = rpc('GET', 'overview').then(viewSettings);
    return load.then(function (node) { $('view').replaceChildren(node); }).catch(function (e) { say(e.message, true); });
  }
  function start() { $('login').hidden = true; $('app').hidden = false; render(); }
  fetch('/api/admin-login').then(function (r) { return r.json(); }).then(function (j) { if (j.loggedIn) start(); else showLogin(); }).catch(showLogin);
})();
</script>
